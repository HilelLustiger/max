[project]
name = "agent"
version = "0.1.0"
description = "Channel-agnostic agent: conversation orchestration, LLM calls"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-core>=0.3",
    "pydantic-settings>=2.4",
    "db",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.uv.sources]
db = { workspace = true }

[tool.pytest.ini_options]
markers = ["integration: needs a real Postgres database (see scripts/test-integration.sh)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
