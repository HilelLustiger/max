[project]
name = "integration"
version = "0.1.0"
description = "Cross-service integration tests: boots real services against a real Postgres"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "db",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tests"]
