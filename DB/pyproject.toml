[project]
name = "db"
version = "0.1.0"
description = "Shared persistence package: models, migrations, repository helpers"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["db"]

[tool.pytest.ini_options]
markers = ["integration: needs a real Postgres database (see scripts/test.sh)"]
